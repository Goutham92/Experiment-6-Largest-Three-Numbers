apiVersion: apps/v1
kind: Deployment
metadata:
  name: largest-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: largest-app
  template:
    metadata:
      labels:
        app: largest-app
    spec:
      containers:
      - name: nginx
        image: largest-app:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: largest-app-service
spec:
  type: NodePort
  selector:
    app: largest-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
